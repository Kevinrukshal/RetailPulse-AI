[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse-ai"
version = "1.2.0"
description = "Local-first retail analytics, ETL, and business intelligence platform."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{ name = "Kevin" }]
dependencies = [
    "alembic>=1.20.1,<2.0",
    "fastapi>=0.139.2,<0.140",
    "openpyxl>=3.1.5,<4.0",
    "defusedxml>=0.7.1,<1.0",
    "pandas>=3.0.6,<3.1",
    "psycopg[binary]>=3.3.8,<3.4",
    "pydantic-settings>=2.16.2,<3.0",
    "sqlalchemy>=2.0.57,<2.1",
    "uvicorn[standard]>=0.54,<1.0",
]

[project.optional-dependencies]
ai = [
    "openai>=2.54.0,<3.0",
]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.1,<8.0",
    "ruff>=0.15.22,<0.16",
]

[tool.setuptools.packages.find]
include = ["ai*", "app*", "etl*"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires a migrated PostgreSQL test database"]

[tool.coverage.run]
branch = true
source = ["ai", "app", "etl"]

[tool.coverage.report]
show_missing = true
skip_covered = true
