name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: retailpulse_test
          POSTGRES_USER: retailpulse_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retailpulse_test -d retailpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://retailpulse_test:test_password@localhost:5432/retailpulse_test
      RUN_INTEGRATION_TESTS: "1"
      AI_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Exercise idempotent sample load
        run: |
          python -m etl.pipeline --file data/sample/sample_sales.csv
          python -m etl.pipeline --file data/sample/sample_sales.csv
      - name: Run tests with coverage gate
        run: >-
          python -m pytest
          --cov=app --cov=etl
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

